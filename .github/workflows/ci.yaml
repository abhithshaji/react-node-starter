name: Vite_Node_Starter CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    environment: testing
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run client eslint
        run: pnpm --filter client lint:eslint-check

      - name: Run server eslint
        run: pnpm --filter server lint:eslint-check

      - name: Run stylelint
        run: pnpm --filter client lint:stylelint-check

      - name: Run prettier
        run: pnpm run format:check

      - name: Run unit tests
        run: pnpm --filter client test:unit
        env:
          CLIENT_PORT: ${{secrets.CLIENT_PORT}}
          VITE_ENV: ${{vars.VITE_ENV}}

    # e2e test are run after build
    #   - name: Build client
    #     run: pnpm --filter client build

    #   - name: Run E2E tests
    #     run: pnpm --filter client test:e2e

    #   - name: Run test coverage
    #     run: pnpm --filter client test:coverage

  production:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate prisma files
        run: pnpm --filter server prisma:generate

      - name: Build client
        run: pnpm --filter client build
        env:
          CLIENT_PORT: ${{secrets.CLIENT_PORT}}
          VITE_ENV: ${{vars.VITE_ENV}}
          SENTRY_AUTH_TOKEN: ${{secrets.SENTRY_AUTH_TOKEN}}
          VITE_SENTRY_DSN: ${{vars.VITE_SENTRY_DSN}}

      - name: Build server
        run: pnpm --filter server dist
        env:
          SERVER_PORT: ${{secrets.SERVER_PORT}}
          ENV: ${{secrets.ENV}}
          SERVER_URL: ${{secrets.SERVER_URL}}
          DATABASE_URL: ${{secrets.DATABASE_URL}}
          MONGODB_URL: ${{secrets.MONGODB_URL}}

        # - name: Upload build artifacts
        #   uses: actions/upload-artifact@v4
        #   with:
        #     name: dist
        #     path: dist

